plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.likelion'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "1.0.0")
	sentryVersion = "8.16.0"
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

	// redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Flyway (DB 스키마 버전 관리)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// JWT 관련 의존성
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// websocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	//google tts,stt
	implementation 'com.google.cloud:google-cloud-texttospeech:2.20.0'

	implementation 'com.google.cloud:google-cloud-speech:4.12.0'
	implementation 'net.java.dev.jna:jna:5.13.0' // 마이크 I/O 관련 이슈 대응용

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'

	// Testcontainers (3층 통합 테스트)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	// docker-java-core: DOCKER_API_VERSION 환경변수 읽기 위해 필요 (Docker Desktop 4.x+ 호환)
	testImplementation 'com.github.docker-java:docker-java-core:3.4.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// ShedLock (분산 스케줄 락)
	implementation 'net.javacrumbs.shedlock:shedlock-spring:6.6.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:6.6.0'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 운영 메트릭 / 상태 확인
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'com.github.loki4j:loki-logback-appender:2.0.0'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// Sentry (에러 / 성능 모니터링)
	implementation 'io.sentry:sentry-spring-boot-starter-jakarta'
	implementation 'io.sentry:sentry-logback'

	// JSON 로그 출력
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "io.sentry:sentry-bom:$sentryVersion"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Docker Desktop 4.x (API 1.40+) 대응 — docker-java 기본 API 1.32 오버라이드
	environment "DOCKER_API_VERSION", "1.44"
	environment "DOCKER_HOST", "unix:///var/run/docker.sock"
	environment "TESTCONTAINERS_RYUK_DISABLED", "false"
}
