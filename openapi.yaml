openapi: 3.0.3

info:
  title: RealTalk API
  description: |
    실시간 양자 토론 플랫폼 RealTalk의 REST API 명세.

    **WebSocket/STOMP 이벤트**는 OpenAPI 3.0 미지원으로 SPEC.md 섹션 7 참조.

    **인증**: OAuth2 로그인(`/oauth2/authorization/{provider}`) 후 발급된
    JWT를 `Authorization: Bearer {token}` 헤더로 전달.
  version: 2.0.0
  contact:
    name: RealTalk Team

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버
  - url: https://api.realtalks.co.kr
    description: 프로덕션 서버

tags:
  - name: Auth
    description: 인증 및 토큰 관리
  - name: Debate Rooms
    description: 토론 방 생성·조회·시작·종료
  - name: Debate Results
    description: 토론 결과·AI 분석·투표
  - name: Categories
    description: 토론 카테고리
  - name: Topics
    description: 토론 주제 (Admin)

# ─────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────
paths:

  # ── Auth ──────────────────────────────
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Access Token 갱신
      description: Refresh Token 쿠키를 이용해 새 Access Token을 발급한다.
      security: []
      parameters:
        - in: cookie
          name: refreshToken
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 갱신 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTokenRefresh"
              example:
                success: true
                status: 200
                message: OK
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiJ9..."
                  expiresIn: 3600
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: 내 프로필 조회
      description: 현재 로그인한 사용자의 프로필을 반환한다.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUserProfile"
              example:
                success: true
                status: 200
                message: OK
                data:
                  userId: 42
                  username: "홍길동"
                  nickname: "길동이"
                  role: "USER"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: Refresh Token을 무효화하고 세션을 종료한다.
      security:
        - BearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/OkNoData"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /oauth2/authorization/{provider}:
    get:
      tags: [Auth]
      summary: OAuth2 로그인 시작
      description: |
        브라우저를 OAuth2 제공자의 동의 화면으로 리다이렉트한다.
        성공 시 JWT가 쿠키/헤더로 설정되고 프론트엔드로 리다이렉트됨.
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [google, kakao]
          example: google
      responses:
        "302":
          description: OAuth2 제공자로 리다이렉트

  # ── Debate Rooms ──────────────────────
  /api/debate-rooms:
    get:
      tags: [Debate Rooms]
      summary: 전체 방 목록 조회
      description: WAITING 상태의 토론 방 목록을 반환한다.
      security: []
      parameters:
        - in: query
          name: categoryId
          schema:
            type: integer
            format: int64
          description: 카테고리 필터 (선택)
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDebateRoomList"
              example:
                success: true
                status: 200
                message: OK
                data:
                  - uuid: "b6610d9d-175c-477a-bdab-c86972ce4c03"
                    title: "기본 소득제를 도입해야 한다"
                    sideA: "찬성"
                    sideB: "반대"
                    status: "WAITING"
                    debateType: "NORMAL"
                    categoryName: "경제"
                    speakersA: 1
                    speakersB: 0
                    audiences: 5
                    maxSpeaker: 2
                    maxAudience: 100
                    createdAt: "2026-05-05T10:00:00Z"

    post:
      tags: [Debate Rooms]
      summary: 토론 방 생성
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
            example:
              title: "기본 소득제를 도입해야 한다"
              description: "찬반 양측 자유 토론"
              categoryId: 2
              sideA: "찬성"
              sideB: "반대"
              turnDurationSecs: 90
              totalDurationSecs: 600
              maxSpeaker: 2
              maxAudience: 100
              debateType: "NORMAL"
      responses:
        "201":
          description: 방 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCreateRoom"
              example:
                success: true
                status: 201
                message: Created
                data:
                  roomUuid: "b6610d9d-175c-477a-bdab-c86972ce4c03"
                  roomId: 42
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/debate-rooms/{roomUuid}:
    get:
      tags: [Debate Rooms]
      summary: 방 상세 조회
      security: []
      parameters:
        - $ref: "#/components/parameters/RoomUuid"
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDebateRoomDetail"
              example:
                success: true
                status: 200
                message: OK
                data:
                  uuid: "b6610d9d-175c-477a-bdab-c86972ce4c03"
                  title: "기본 소득제를 도입해야 한다"
                  description: "찬반 양측 자유 토론"
                  sideA: "찬성"
                  sideB: "반대"
                  status: "WAITING"
                  debateType: "NORMAL"
                  turnDurationSecs: 90
                  totalDurationSecs: 600
                  maxSpeaker: 2
                  maxAudience: 100
                  currentParticipants:
                    speakersA: 1
                    speakersB: 0
                    audiences: 12
                  categoryName: "경제"
                  createdAt: "2026-05-05T10:00:00Z"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/debate-rooms/{roomUuid}/start:
    post:
      tags: [Debate Rooms]
      summary: 토론 시작
      description: WAITING 상태의 방을 STARTED로 전환한다. 방 개설자만 가능.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomUuid"
      responses:
        "200":
          $ref: "#/components/responses/OkNoData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 이미 시작됨 또는 발언자 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyStarted:
                  summary: 이미 시작된 방
                  value:
                    success: false
                    status: 409
                    message: "이미 시작된 토론 방입니다."
                    code: "ROOM_ALREADY_STARTED"
                    data: null
                noSpeakers:
                  summary: 발언자 없음
                  value:
                    success: false
                    status: 422
                    message: "발언자가 없어 토론을 시작할 수 없습니다."
                    code: "INSUFFICIENT_SPEAKERS"
                    data: null

  /api/debate-rooms/{roomUuid}/end:
    post:
      tags: [Debate Rooms]
      summary: 토론 강제 종료
      description: STARTED 상태의 방을 ENDED로 전환한다. 방 개설자만 가능.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RoomUuid"
      responses:
        "200":
          $ref: "#/components/responses/OkNoData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 이미 종료됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/debate-rooms/match:
    post:
      tags: [Debate Rooms]
      summary: 카테고리 기반 방 매칭
      description: WAITING 상태의 동일 카테고리 방을 반환한다. 없으면 null.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId:
                  type: integer
                  format: int64
            example:
              categoryId: 2
      responses:
        "200":
          description: 매칭 결과 (없으면 data: null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDebateRoomDetail"

  # ── Debate Results ────────────────────
  /api/debate-results/{roomUuid}:
    get:
      tags: [Debate Results]
      summary: 토론 결과 조회
      description: ENDED 상태의 방에서 AI 종합 분석과 투표 결과를 반환한다.
      security: []
      parameters:
        - $ref: "#/components/parameters/RoomUuid"
      responses:
        "200":
          description: 결과 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDebateResult"
              example:
                success: true
                status: 200
                message: OK
                data:
                  aiAnalysis: "이번 토론에서 A측은 경제적 관점을 중심으로..."
                  sideAVotes: 25
                  sideBVotes: 15
                  totalVotes: 40
                  sideARate: 62.5
                  sideBRate: 37.5
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 아직 종료되지 않은 방
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/debate-results/{roomUuid}/vote:
    post:
      tags: [Debate Results]
      summary: 선호 입장 투표
      description: |
        토론 종료 후 A 또는 B에 투표한다.
        로그인 사용자는 userId 기준, 게스트는 sessionId 기준으로 중복 투표를 방지한다.
      security: []
      parameters:
        - $ref: "#/components/parameters/RoomUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side]
              properties:
                side:
                  $ref: "#/components/schemas/Side"
            example:
              side: "A"
      responses:
        "200":
          description: 투표 성공, 갱신된 집계 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDebateResult"
        "400":
          description: 중복 투표
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                status: 400
                message: "이미 투표했습니다."
                code: "DUPLICATE_VOTE"
                data: null
        "404":
          $ref: "#/components/responses/NotFound"

  /api/debate/{roomUuid}/speeches:
    get:
      tags: [Debate Results]
      summary: 턴별 발언 및 AI 요약 목록
      security: []
      parameters:
        - $ref: "#/components/parameters/RoomUuid"
      responses:
        "200":
          description: 발언 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSpeechList"
              example:
                success: true
                status: 200
                message: OK
                data:
                  - turnIndex: 1
                    side: "A"
                    speakerName: "홍길동"
                    transcript: "기본 소득제는 빈곤 해소에..."
                    aiSummary: "발언자는 기본소득이 빈곤 해소에 효과적이라고 주장했다."
                    spokenAt: "2026-05-05T10:00:00Z"
                  - turnIndex: 2
                    side: "B"
                    speakerName: "김철수"
                    transcript: "반면 재정 건전성 문제가..."
                    aiSummary: "발언자는 재정 부담을 우려하며 기본소득에 반대했다."
                    spokenAt: "2026-05-05T10:01:30Z"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Categories ────────────────────────
  /api/categories:
    get:
      tags: [Categories]
      summary: 전체 카테고리 목록
      security: []
      responses:
        "200":
          description: 카테고리 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCategoryList"
              example:
                success: true
                status: 200
                message: OK
                data:
                  - id: 1
                    categoryName: "정치"
                  - id: 2
                    categoryName: "경제"
                  - id: 3
                    categoryName: "사회"

  # ── Topics ────────────────────────────
  /api/debate-topics:
    get:
      tags: [Topics]
      summary: 전체 토론 주제 목록
      security: []
      responses:
        "200":
          description: 주제 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopicList"

    post:
      tags: [Topics]
      summary: 토론 주제 등록
      description: ADMIN 권한 필요.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 200
            example:
              title: "AI가 인간의 일자리를 대체할 것이다"
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTopic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/debate-topics/{id}:
    delete:
      tags: [Topics]
      summary: 토론 주제 삭제
      description: ADMIN 권한 필요.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          $ref: "#/components/responses/OkNoData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

# ─────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT Access Token. 발급: POST /api/auth/refresh 또는 OAuth2 로그인"

  parameters:
    RoomUuid:
      in: path
      name: roomUuid
      required: true
      schema:
        type: string
        format: uuid
      example: "b6610d9d-175c-477a-bdab-c86972ce4c03"

  responses:
    OkNoData:
      description: 성공 (data 없음)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: true
            status: 200
            message: OK
            data: null

    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            status: 400
            message: "입력값이 올바르지 않습니다."
            code: "INVALID_INPUT"
            data: null

    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            status: 401
            message: "인증이 필요합니다."
            code: "UNAUTHORIZED"
            data: null

    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            status: 403
            message: "접근 권한이 없습니다."
            code: "FORBIDDEN"
            data: null

    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            status: 404
            message: "토론 방을 찾을 수 없습니다."
            code: "DEBATE_ROOM_NOT_FOUND"
            data: null

  schemas:

    # ── Enums ──────────────────────────
    DebateStatus:
      type: string
      enum: [WAITING, STARTED, ENDED]
      description: 토론 방 상태

    DebateType:
      type: string
      enum: [NORMAL, FAST]
      description: "NORMAL: 일반 토론 / FAST: 턴 시간 50% 단축"

    ParticipantRole:
      type: string
      enum: [SPEAKER, AUDIENCE]

    Side:
      type: string
      enum: [A, B]

    UserRole:
      type: string
      enum: [USER, ADMIN]

    # ── Common ─────────────────────────
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: integer
        message:
          type: string
        code:
          type: string
          description: 에러 코드 (ErrorCode enum)
        data:
          nullable: true

    # ── Domain Schemas ─────────────────
    UserProfile:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/UserRole"

    TokenRefresh:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: 유효기간(초)

    DebateRoomSummary:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        title:
          type: string
        sideA:
          type: string
        sideB:
          type: string
        status:
          $ref: "#/components/schemas/DebateStatus"
        debateType:
          $ref: "#/components/schemas/DebateType"
        categoryName:
          type: string
          nullable: true
        speakersA:
          type: integer
        speakersB:
          type: integer
        audiences:
          type: integer
        maxSpeaker:
          type: integer
        maxAudience:
          type: integer
        createdAt:
          type: string
          format: date-time

    DebateRoomDetail:
      allOf:
        - $ref: "#/components/schemas/DebateRoomSummary"
        - type: object
          properties:
            description:
              type: string
              nullable: true
            turnDurationSecs:
              type: integer
            totalDurationSecs:
              type: integer
            currentParticipants:
              type: object
              properties:
                speakersA:
                  type: integer
                speakersB:
                  type: integer
                audiences:
                  type: integer
            startedAt:
              type: string
              format: date-time
              nullable: true
            endedAt:
              type: string
              format: date-time
              nullable: true

    CreateRoomRequest:
      type: object
      required: [title, sideA, sideB, turnDurationSecs, totalDurationSecs]
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        categoryId:
          type: integer
          format: int64
          nullable: true
        sideA:
          type: string
          maxLength: 255
        sideB:
          type: string
          maxLength: 255
        turnDurationSecs:
          type: integer
          minimum: 10
          maximum: 600
        totalDurationSecs:
          type: integer
          minimum: 60
          maximum: 7200
        maxSpeaker:
          type: integer
          minimum: 2
          maximum: 10
          default: 2
        maxAudience:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100
        debateType:
          $ref: "#/components/schemas/DebateType"

    CreateRoomResponse:
      type: object
      properties:
        roomUuid:
          type: string
          format: uuid
        roomId:
          type: integer
          format: int64

    DebateResult:
      type: object
      properties:
        aiAnalysis:
          type: string
          nullable: true
          description: Claude AI 종합 분석 (비동기 생성, null일 수 있음)
        sideAVotes:
          type: integer
        sideBVotes:
          type: integer
        totalVotes:
          type: integer
        sideARate:
          type: number
          format: double
          description: A측 선호 비율 (0~100)
        sideBRate:
          type: number
          format: double
          description: B측 선호 비율 (0~100)

    Speech:
      type: object
      properties:
        turnIndex:
          type: integer
        side:
